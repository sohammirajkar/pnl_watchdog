services:
  - type: web
    name: pnl-watchdog
    env: docker
    plan: free
    region: singapore
    buildCommand: docker build -t pnl-watchdog .
    startCommand: uvicorn pnl_watchdog_lib.api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8000
