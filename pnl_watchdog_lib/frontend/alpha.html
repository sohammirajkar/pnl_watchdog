<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Execution Console</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-2: #27272a;
            --border: #3f3f46;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.125rem;
        }

        .logo-text span {
            color: var(--accent);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
        }

        /* Main Layout */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: var(--accent);
        }

        .message.assistant .avatar {
            background: var(--surface-2);
            border: 1px solid var(--border);
        }

        .message-content {
            max-width: 80%;
        }

        .message.user .message-content {
            text-align: right;
        }

        .message-text {
            padding: 0.875rem 1.125rem;
            border-radius: 1rem;
            line-height: 1.5;
        }

        .message.user .message-text {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant .message-text {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 0.25rem;
        }

        /* Analysis Card */
        .analysis-card {
            margin-top: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .analysis-header {
            padding: 0.75rem 1rem;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analysis-title {
            font-weight: 500;
            font-size: 0.875rem;
        }

        .risk-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .risk-safe {
            background: rgba(34, 197, 94, 0.2);
            color: var(--green);
        }

        .risk-caution {
            background: rgba(234, 179, 8, 0.2);
            color: var(--yellow);
        }

        .risk-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
        }

        .analysis-body {
            padding: 1rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .metric {
            text-align: center;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 0.5rem;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .metric-label {
            font-size: 0.625rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            text-transform: uppercase;
        }

        .analysis-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 0.875rem 1rem;
            padding-right: 3rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9375rem;
            resize: none;
            min-height: 48px;
            max-height: 120px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .mic-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mic-btn:hover {
            background: var(--surface-2);
            color: var(--accent);
        }

        .mic-btn.recording {
            background: var(--red);
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateY(-50%) scale(1);
            }

            50% {
                transform: translateY(-50%) scale(1.1);
            }
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 0.75rem;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-light);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 3rem 2rem;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .example-btn {
            padding: 0.75rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-btn:hover {
            border-color: var(--accent);
            background: var(--surface-2);
        }

        /* Loading */
        .typing-indicator {
            display: flex;
            gap: 0.25rem;
            padding: 0.875rem 1.125rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            border-bottom-left-radius: 0.25rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">Alpha <span>Console</span></span>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connected</span>
        </div>
    </header>

    <main class="main">
        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🐶</div>
                    <h1 class="welcome-title">Alpha Execution Console</h1>
                    <p class="welcome-subtitle">Describe your trade in natural language. I'll analyze strategy and
                        execution risk.</p>
                    <div class="examples">
                        <button class="example-btn" onclick="useExample('5000 share iron condor on NVDA')">Iron Condor
                            on NVDA</button>
                        <button class="example-btn" onclick="useExample('Buy 100 NIFTY 24500 CE at 180')">Buy NIFTY
                            Call</button>
                        <button class="example-btn" onclick="useExample('Analyze bull call spread on AAPL')">Bull Call
                            Spread AAPL</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="chatInput"
                            placeholder="Describe your trade... (e.g., 'Iron condor on NVDA')" rows="1"></textarea>
                        <button class="mic-btn" id="micBtn" title="Voice input">
                            🎤
                        </button>
                    </div>
                    <button class="send-btn" id="sendBtn" title="Send">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8000';
        const messagesEl = document.getElementById('messages');
        const welcomeEl = document.getElementById('welcome');
        const inputEl = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');

        let isRecording = false;
        let recognition = null;

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = inputEl.scrollHeight + 'px';
        });

        // Send on Enter (Shift+Enter for newline)
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.onclick = sendMessage;

        // Voice input setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                inputEl.value = transcript;
                inputEl.dispatchEvent(new Event('input'));
                stopRecording();
            };

            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();

            micBtn.onclick = toggleRecording;
        } else {
            micBtn.style.display = 'none';
        }

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            isRecording = true;
            micBtn.classList.add('recording');
            recognition.start();
        }

        function stopRecording() {
            isRecording = false;
            micBtn.classList.remove('recording');
            try { recognition.stop(); } catch (e) { }
        }

        function useExample(text) {
            inputEl.value = text;
            inputEl.dispatchEvent(new Event('input'));
            sendMessage();
        }

        function addMessage(role, content, analysis = null) {
            welcomeEl.style.display = 'none';

            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;

            let analysisHtml = '';
            if (analysis) {
                const risk = analysis.execution_risk;
                const strategy = analysis.strategy_analysis;
                const riskClass = risk.risk_verdict === 'SAFE' ? 'risk-safe' :
                    risk.risk_verdict === 'CAUTION' ? 'risk-caution' : 'risk-danger';

                // Build strategy section if available
                let strategySection = '';
                if (strategy) {
                    const greeks = strategy.greeks;
                    const payoff = strategy.payoff;
                    strategySection = `
                        <div style="margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);">
                            <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">Greeks</div>
                            <div class="metrics-grid" style="grid-template-columns: repeat(4, 1fr);">
                                <div class="metric">
                                    <div class="metric-value" style="color: ${greeks.delta >= 0 ? 'var(--green)' : 'var(--red)'}">${greeks.delta >= 0 ? '+' : ''}${greeks.delta.toFixed(2)}</div>
                                    <div class="metric-label">Delta</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${greeks.gamma.toFixed(4)}</div>
                                    <div class="metric-label">Gamma</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value" style="color: ${greeks.theta >= 0 ? 'var(--green)' : 'var(--red)'}">${greeks.theta >= 0 ? '+' : ''}${greeks.theta.toFixed(2)}</div>
                                    <div class="metric-label">Theta</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${greeks.vega.toFixed(2)}</div>
                                    <div class="metric-label">Vega</div>
                                </div>
                            </div>
                        </div>
                        <div style="margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);">
                            <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">Payoff</div>
                            <div class="metrics-grid">
                                <div class="metric">
                                    <div class="metric-value" style="color: var(--green)">+$${Math.abs(payoff.max_profit).toFixed(0)}</div>
                                    <div class="metric-label">Max Profit</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value" style="color: var(--red)">-$${Math.abs(payoff.max_loss).toFixed(0)}</div>
                                    <div class="metric-label">Max Loss</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${(payoff.probability_of_profit * 100).toFixed(0)}%</div>
                                    <div class="metric-label">Win Rate</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                analysisHtml = `
                    <div class="analysis-card">
                        <div class="analysis-header">
                            <span class="analysis-title">${analysis.intent.ticker} - ${analysis.intent.strategy_name || 'Analysis'}</span>
                            <span class="risk-badge ${riskClass}">${risk.risk_verdict}</span>
                        </div>
                        <div class="analysis-body">
                            ${strategySection}
                            <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">Execution Risk</div>
                            <div class="metrics-grid">
                                <div class="metric">
                                    <div class="metric-value">${risk.kyles_lambda.toFixed(6)}</div>
                                    <div class="metric-label">Lambda</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${risk.tcm_score.toFixed(1)}</div>
                                    <div class="metric-label">TCM Score</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${(risk.volume_imbalance >= 0 ? '+' : '') + risk.volume_imbalance.toFixed(3)}</div>
                                    <div class="metric-label">Imbalance</div>
                                </div>
                            </div>
                        </div>
                        <div class="analysis-footer">
                            ${risk.risk_explanation}
                        </div>
                    </div>
                `;
            }

            msgEl.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🐶'}</div>
                <div class="message-content">
                    <div class="message-text">${content}</div>
                    ${analysisHtml}
                </div>
            `;

            messagesEl.appendChild(msgEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typing';
            indicator.innerHTML = `
                <div class="avatar">🐶</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            messagesEl.appendChild(indicator);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage('user', text);
            addTypingIndicator();

            try {
                const response = await fetch(`${API_URL}/v1/alpha/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                removeTypingIndicator();

                addMessage('assistant', data.speak_text, data);

                // TTS (if available)
                if ('speechSynthesis' in window && data.speak_text) {
                    const utterance = new SpeechSynthesisUtterance(data.speak_text);
                    utterance.rate = 1.0;
                    speechSynthesis.speak(utterance);
                }

            } catch (e) {
                removeTypingIndicator();
                addMessage('assistant', 'Sorry, I couldn\'t analyze that. Make sure the API is running.');
            }

            sendBtn.disabled = false;
        }

        // Check API status
        async function checkStatus() {
            try {
                const res = await fetch(`${API_URL}/v1/alpha/status`);
                if (res.ok) {
                    document.getElementById('statusDot').style.background = 'var(--green)';
                    document.getElementById('statusText').textContent = 'Connected';
                } else {
                    throw new Error();
                }
            } catch (e) {
                document.getElementById('statusDot').style.background = 'var(--red)';
                document.getElementById('statusText').textContent = 'Disconnected';
            }
        }

        checkStatus();
        setInterval(checkStatus, 10000);
    </script>
</body>

</html>
