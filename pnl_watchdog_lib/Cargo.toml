[package]
name = "pnl_watchdog"
version = "0.6.0"
edition = "2021"
description = "Infrastructure Economics Advisor: Measure Kyle's Lambda fairness gaps using Rust-accelerated calculations. Optimize trading strategy within broker latency constraints."
license = "MIT"
homepage = "https://github.com/sohammirajkar/pnl_watchdog"
repository = "https://github.com/sohammirajkar/pnl_watchdog"
documentation = "https://github.com/sohammirajkar/pnl_watchdog#readme"

[lib]
name = "pnl_watchdog"
crate-type = ["cdylib"]

[dependencies]
# We explicitly use 0.21+ to match the new syntax
pyo3 = { version = "0.21.2", features = ["extension-module"] }
