[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pnl-watchdog"
version = "0.1.0"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
description = "A safety tool for algo-traders to detect silent broker failures."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests>=2.25.0"]

[project.urls]
"Homepage" = "https://github.com/yourusername/pnl-watchdog"
"Cloud Version" = "https://pnlwatchdog.com"                 # <-- THE UPSELL LINK
