version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pnl_watchdog
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pnl_watchdog
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize schema on first run
      - ./pnl_watchdog_lib/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
